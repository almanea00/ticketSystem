[project]
name = "ticket-assistant"
version = "0.1.0"
description = "Ticket Assistant: d1-3B + LoRA decisions, EmbeddingGemma retrieval, cited replies (SDAIA Academy Applied NLP capstone)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "gradio>=6.30",
    "laya==0.4.7",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "peft>=0.21",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1",
    "sentencepiece>=0.2.2",
    "tabulate>=0.10.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=5.14",
]

[tool.uv]
package = false   # an application: run with `uv run python -m ticketassist.web`
